    headline: Write, structure, and share work that stays useful.
    description: Create block-based documents with reusable templates, version history, publishing, and AI-assisted drafting.
    features: [Block editor and templates, Versions and snapshots, Controlled public sharing]
  FastDrive:
    slug: drive
    accent: "#0f766e"
    tint: "#ecfdf9"
