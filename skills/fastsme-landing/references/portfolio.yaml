    headline: Turn every customer signal into momentum.
    description: Bring leads, contacts, activities, tasks, and a visual deal pipeline into one focused sales workspace.
    features: [Visual deal pipeline, Unified customer timeline, Grounded sales copilot]
  FastDocs:
    slug: docs
    accent: "#2563eb"
    tint: "#eff6ff"
