apps:
  FastFunnel:
    cohort: custom
    slug: funnel
    accent: "#f97316"
    tint: "#fff7ed"
    eyebrow: Autonomous marketing
    headline: Build demand with an agency that knows its guardrails.
    description: Plan, create, review, schedule, distribute, and measure marketing work through a bounded autonomous agency.
    features: [Campaign planning, Content review and scheduling, Integrations and performance analytics]
  FastClinic:
    slug: clinic
    accent: "#1e6fb8"
    tint: "#eef7ff"
    eyebrow: Clinic operations
    headline: Modern clinical care, made personal.
    description: Run appointments, patient operations, billing, recall, revenue, and multi-specialty workflows from one clinical cockpit.
    features: [Appointments and availability, Patient and treatment operations, Billing and balanced ledgers]
  FastCMS:
    cohort: custom
    slug: cms
    accent: "#7c3aed"
    tint: "#f5f3ff"
    eyebrow: Content management
    headline: Publish structured content without a heavyweight stack.
    description: Build page trees from reusable blocks, manage media and revisions, collect forms, and serve content through a clean API.
    features: [Structured pages and blocks, Media and revisions, Forms and headless API]
  FastCRM:
    slug: crm
    accent: "#4f46e5"
    tint: "#f2f1ff"
