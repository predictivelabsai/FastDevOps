defaults:
  branch: main
  build:
    type: dockerfile
    dockerfile: /Dockerfile
    context: /
  coolify:
    server: localhost
  cloud_run:
    cpu: "1"
    memory: 512Mi
    min_instances: 0
    max_instances: 3
    concurrency: 80

services:
  fastaccounts:
    description: Open bookkeeping and accountant-ready accounting for the UK and Estonia
    repo: predictivelabsai/FastAccounts
    local_dir: FastAccounts
    port: 5012
    domain: https://fastaccounts.org
    health: {path: /healthz, enabled: false}
    volume: /data
    database_schema: fast_accounts
    env:
      sources: [FastERP]
      required: [DB_URL, FASTACCOUNTS_SECRET, FASTACCOUNTS_ENCRYPTION_KEY, FASTACCOUNTS_COMMIT, FASTACCOUNTS_BRANCH, FASTACCOUNTS_BUILD_DATE, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, POSTMARK_API_TOKEN]
      generate: [FASTACCOUNTS_SECRET, FASTACCOUNTS_ENCRYPTION_KEY]
      runtime:
        FASTACCOUNTS_PORT: "5012"
        FASTACCOUNTS_ENV_LABEL: production
        FASTACCOUNTS_PUBLIC_URL: https://fastaccounts.org
        FASTACCOUNTS_DATA_DIR: /data
        DB_SCHEMA: fast_accounts
        GOOGLE_REDIRECT_URI: https://fastaccounts.org/auth/google/callback
        GOOGLE_ALLOWED_EMAILS: kaljuvee@gmail.com
        FROM_EMAIL: info@fastsme.com
        FASTACCOUNTS_CORS_ORIGINS: https://fastaccounts.org
        FASTACCOUNTS_ALLOW_TEST_AUTH: "false"
  fastwiki:
    description: FastWiki open knowledge workspace
    repo: predictivelabsai/FastWiki
    local_dir: FastWiki
    port: 5022
    domain: https://wiki.fastsme.com
    health: {path: /health}
    volume: /data
    env:
      required: [FASTWIKI_SECRET, FASTOFFICE_SSO_SECRET]
      runtime:
        FASTWIKI_ENV: production
        FASTWIKI_PORT: "5022"
        FASTWIKI_DB: /data/fastwiki.sqlite
        FASTWIKI_UPLOAD_DIR: /data/uploads
        FASTWIKI_ATTACHMENT_BACKEND: local
        FASTOFFICE_URL: https://office.fastsme.com
  fastcal:
    description: FastCal open calendar and public scheduling
    repo: predictivelabsai/FastCal
    local_dir: FastCal
    port: 5021
    domain: https://cal.fastsme.com
    domains:
      - https://cal.fastsme.com
      - https://calendar.fastsme.com
    health: {path: /health}
    database_schema: fast_cal
    env:
      sources: [FastERP, FastMeet, FastFunnel]
      required: [DB_URL, FASTCAL_SECRET, FASTCAL_ENCRYPTION_KEY, FASTOFFICE_SSO_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, POSTMARK_API_TOKEN]
      generate: [FASTCAL_SECRET, FASTCAL_ENCRYPTION_KEY]
      runtime:
        FASTCAL_ENV: production
        FASTCAL_HOST: 0.0.0.0
        FASTCAL_PORT: "5021"
        FASTCAL_PUBLIC_URL: https://cal.fastsme.com
        DB_SCHEMA: fast_cal
        FASTOFFICE_URL: https://office.fastsme.com
        FASTCAL_DEV_LOGIN: "false"
        GOOGLE_REDIRECT_URI: https://cal.fastsme.com/auth/google/callback
        FASTMEET_URL: https://meet.fastsme.com
        FROM_EMAIL: info@fastsme.com
  fastbooking:
    description: Multi-tenant booking and restaurant commerce platform
    repo: predictivelabsai/FastBooking
    local_dir: FastBooking
    port: 5023
    domain: https://booking.fastsme.com
    health: {path: /healthz}
    database: fastbooking-postgres
    env:
      required:
        - DATABASE_URL
        - SESSION_SECRET
        - GOOGLE_CLIENT_ID
        - GOOGLE_CLIENT_SECRET
        - POSTMARK_API_TOKEN
        - FASTCLINIC_API_TOKEN
      runtime:
        ENVIRONMENT: production
        HOST: 0.0.0.0
        PORT: "5023"
        PUBLIC_URL: https://booking.fastsme.com
        DB_SCHEMA: fastbooking
        DEPLOY_MODE: monolith
        API_BASE_URL: https://booking.fastsme.com
        GOOGLE_REDIRECT_URI: https://booking.fastsme.com/auth/google/callback
        FROM_EMAIL: info@fastsme.com
  fastoffice:
    description: FastOffice open-source productivity suite and AI workspace
    repo: predictivelabsai/FastOffice
    local_dir: FastOffice
    port: 5020
    domain: https://office.fastsme.com
    domains:
      - https://office.fastsme.com
      - https://fastoffice.org
      - https://www.fastoffice.org
    health: {path: /health}
    volume: /data
    env:
      required:
        - XAI_API_KEY
        - GOOGLE_CLIENT_ID
        - GOOGLE_CLIENT_SECRET
        - POSTMARK_API_TOKEN
        - FASTOFFICE_SESSION_SECRET
        - FASTOFFICE_ENCRYPTION_KEY
        - FASTOFFICE_SSO_SECRET
      runtime:
        FASTOFFICE_ENV: production
        FASTOFFICE_PORT: "5020"
        FASTOFFICE_DB: /data/fastoffice.sqlite
        FASTOFFICE_PUBLIC_URL: https://office.fastsme.com
        FASTOFFICE_BOOTSTRAP_ADMIN: kaljuvee@gmail.com
        FASTOFFICE_DEV_LOGIN: "false"
        FASTOFFICE_SUITE_SSO_READY: "true"
        MODEL_PROVIDER: xai
        GOOGLE_REDIRECT_URI: https://office.fastsme.com/auth/google/callback
        FROM_EMAIL: info@fastsme.com
  fastfunnel:
    description: FastFunnel autonomous marketing cockpit
    repo: predictivelabsai/fastfunnel
    local_dir: FastFunnel
    port: 5005
    domain: https://funnel.fastsme.com
    health:
      path: /healthz
    env:
      required:
        - XAI_API_KEY
        - GOOGLE_CLIENT_ID
        - GOOGLE_CLIENT_SECRET
        - POSTMARK_API_TOKEN
      runtime:
        FASTFUNNEL_HOST: 0.0.0.0
        FASTFUNNEL_PORT: "5005"
        FASTFUNNEL_BASE_URL: https://funnel.fastsme.com
        FASTFUNNEL_DEV_AUTH_BYPASS: "0"
        GOOGLE_REDIRECT_URI: https://funnel.fastsme.com/auth/google/callback
        FASTSME_AUTH_DB: /app/data/fastsme-accounts.sqlite
        FASTSME_PUBLIC_URL: https://funnel.fastsme.com
        FROM_EMAIL: info@predictivelabs.ai
  fastclinic:
