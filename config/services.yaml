    local_dir: FastDrive
    port: 5012
    domain: https://drive.fastsme.com
    health: {path: /}
    volume: /data
    env:
      required: [XAI_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET]
      runtime: {FASTDRIVE_PORT: "5012", FASTDRIVE_DB: /data/fastdrive.sqlite, MODEL_PROVIDER: xai, GOOGLE_REDIRECT_URI: https://drive.fastsme.com/auth/google/callback}
