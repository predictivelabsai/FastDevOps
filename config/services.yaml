defaults:
  branch: main
  build:
    type: dockerfile
    dockerfile: /Dockerfile
    context: /
  coolify:
    server: localhost
  cloud_run:
    cpu: "1"
    memory: 512Mi
    min_instances: 0
    max_instances: 3
    concurrency: 80

services:
  fastfunnel:
    description: FastFunnel autonomous marketing cockpit
    repo: predictivelabsai/fastfunnel
    local_dir: FastFunnel
    port: 5005
    domain: https://funnel.fastsme.com
    health:
      path: /healthz
    env:
      required:
        - XAI_API_KEY
        - GOOGLE_CLIENT_ID
        - GOOGLE_CLIENT_SECRET
      runtime:
        FASTFUNNEL_HOST: 0.0.0.0
        FASTFUNNEL_PORT: "5005"
        FASTFUNNEL_BASE_URL: https://funnel.fastsme.com
        FASTFUNNEL_DEV_AUTH_BYPASS: "0"
        GOOGLE_REDIRECT_URI: https://funnel.fastsme.com/auth/google/callback
  fastclinic:
    repo: predictivelabsai/FastClinic
    local_dir: FastClinic
    port: 5005
    domain: https://clinic.fastsme.com
    health: {path: /}
    volume: /data
    env:
      required: [XAI_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET]
      runtime: {FASTCLINIC_PORT: "5005", FASTCLINIC_DB: /data/fastclinic.sqlite, MODEL_PROVIDER: xai, GOOGLE_REDIRECT_URI: https://clinic.fastsme.com/auth/google/callback}
  fastcms:
    repo: predictivelabsai/FastCMS
    local_dir: FastCMS
    port: 5001
    domain: https://cms.fastsme.com
    health: {path: /}
    build: {type: nixpacks, start_command: python main.py}
    volume: /app/data
    env:
      required: [GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET]
      runtime:
        PORT: "5001"
        GOOGLE_REDIRECT_URI: https://cms.fastsme.com/auth/google/callback
        GOOGLE_ALLOWED_EMAILS: kaljuvee@gmail.com
  fastcrm:
    repo: predictivelabsai/FastCRM
    local_dir: FastCRM
    port: 5006
    domain: https://crm.fastsme.com
    health: {path: /}
    volume: /data
    env:
      required: [XAI_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET]
      runtime: {FASTCRM_PORT: "5006", FASTCRM_DB: /data/fastcrm.sqlite, MODEL_PROVIDER: xai, GOOGLE_REDIRECT_URI: https://crm.fastsme.com/auth/google/callback}
  fastdocs:
    repo: predictivelabsai/FastDocs
    local_dir: FastDocs
    port: 5016
    domain: https://docs.fastsme.com
    health: {path: /}
    volume: /data
    env:
      required: [XAI_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET]
      runtime: {FASTDOCS_PORT: "5016", FASTDOCS_DB: /data/fastdocs.sqlite, MODEL_PROVIDER: xai, GOOGLE_REDIRECT_URI: https://docs.fastsme.com/auth/google/callback}
  fastdrive:
