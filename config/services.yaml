        - DATABASE_URL
        - APP_SECRET
        - TOKEN_ENCRYPTION_KEY
        - GOOGLE_CLIENT_ID
        - GOOGLE_CLIENT_SECRET
        - XAI_API_KEY
        - R2_ENDPOINT
        - R2_ACCESS_KEY_ID
        - R2_SECRET_ACCESS_KEY
        - R2_BUCKET
