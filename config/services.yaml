    health: {path: /health}
    volume: /data
    env:
      required: [XAI_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, POSTMARK_API_TOKEN]
      runtime: {DATA_STORAGE: sqlite, DB_URL: "sqlite:////data/fastfund.sqlite", DOC_LOCAL_DIR: /data/docs, LLM_PROVIDER: xai, FASTFUND_AUTOSEED: "1", GOOGLE_REDIRECT_URI: https://fund.fastsme.com/auth/callback, FASTSME_AUTH_DB: /data/fastsme-accounts.sqlite, FASTSME_PUBLIC_URL: https://fund.fastsme.com, FROM_EMAIL: info@predictivelabs.ai}
